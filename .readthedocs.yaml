version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

mkdocs:
  configuration: mkdocs.yml
  # Matches `mkdocs build --strict`, which CI and the contributor workflow use.
  fail_on_warning: true
