# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      run: python -m pip install uv
    - name: Test with pytest
      run: |
        uv run --locked pytest --cov --cov-report=term-missing --cov-fail-under=99
  ruff:
    # Lint and format results don't vary by interpreter, so this matrix is
    # redundant -- but `ruff (3.11)` and `ruff (3.12)` are required status
    # checks on main, so collapsing it to a single job blocks every merge
    # until branch protection is updated to match.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      run: python -m pip install uv
    - name: Run ruff
      run: |
        uv run --locked ruff check --output-format=github .
    - name: Check formatting
      run: |
        uv run --locked ruff format --check .
  mypy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v7
    - name: "Set up Python ${{ matrix.python-version }}"
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      run: python -m pip install uv
    - name: Register mypy problem matcher
      run: |
        echo "::add-matcher::.github/workflows/matchers/mypy.json"
    - name: Run mypy
      run: |
        uv run --locked mypy .
  docs:
    # Read the Docs builds the published site; this catches broken
    # cross-references and other mkdocs warnings on the PR itself.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # setuptools_scm needs history to derive a version
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install uv
      run: python -m pip install uv
    - name: Build docs
      run: |
        uv run --locked --extra docs mkdocs build --strict
  package:
    # Catches packaging problems (bad metadata, a README that won't render on
    # PyPI) here rather than at release time, when publishing is automatic.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # setuptools_scm needs history to derive a version
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install uv
      run: python -m pip install uv
    - name: Build distributions
      run: uv build
    - name: Check distribution metadata
      run: uvx twine check --strict dist/*
