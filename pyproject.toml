[build-system]
requires      = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name            = "pydrawise"
description     = "Python API for interacting with Hydrawise sprinkler controllers."
authors         = [
    {name = "David Knowles", email = "dknowles2@gmail.com"},
]
dependencies    = ["aiohttp", "apischema", "gql", "graphql-core", "requests"]
requires-python = ">=3.11"
dynamic         = ["readme", "version"]
license         = {text = "Apache-2.0"}
keywords        = ["hydrawise", "api", "iot"]
classifiers     = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
docs = ["mkdocs==1.6.1", "mkdocstrings==1.0.6", "mkdocstrings-python==2.0.7"]

[project.urls]
"Homepage"      = "https://github.com/dknowles2/pydrawise"
"Source Code"   = "https://github.com/dknowles2/pydrawise"
"Bug Reports"   = "https://github.com/dknowles2/pydrawise/issues"

[dependency-groups]
test = [
    "freezegun==1.5.5",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
    "types-requests==2.33.0.20260712",
]
dev = [{ include-group = "test" }, "pre-commit==4.6.2"]

[tool.setuptools]
platforms            = ["any"]
zip-safe             = true
include-package-data = true
# Declared explicitly rather than auto-discovered: flat-layout discovery scans
# the working tree, so a stray directory (e.g. `site/` from `mkdocs build`)
# makes it ambiguous and fails the build.
packages             = ["pydrawise"]

[tool.setuptools.dynamic]
readme          = { file = ["README.md"], content-type = "text/markdown" }

[tool.setuptools_scm]
write_to = "pydrawise/_version.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts      = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["pydrawise"]
omit   = ["pydrawise/_version.py"]  # generated by setuptools_scm at build time

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["DTZ", "RUF009"]

[tool.mypy]
check_untyped_defs   = true
no_implicit_optional = true
strict_equality      = true
warn_redundant_casts = true
warn_unused_configs  = true
warn_unused_ignores  = true

# The library itself must be fully annotated. The test suite is deliberately
# held to a looser standard so fixtures and mocks stay readable.
[[tool.mypy.overrides]]
module                   = "pydrawise.*"
disallow_incomplete_defs = true
disallow_untyped_defs    = true

